<div class="hero h-quiz"><div class="wrap"><h1>Quiz: Was weißt du noch?</h1><p>Sechs schnelle Fragen zur Präsentation. Ideal, um die Klasse am Ende wach zu halten.</p><div class="acts"><a class="btn ghost" href="../">Zurück zur Präsentation</a></div></div></div><main class="wrap page"><div id="quiz" class="quiz"></div></main><script>
(() => {
  const Q = [{"q": "Was ist Dopamin?", "a": ["ein Botenstoff im Gehirn", "ein Muskel im Kopf", "ein Vitamin aus Obst"], "r": 0, "why": "Dopamin trägt Signale von einer Nervenzelle zur nächsten."}, {"q": "Wann schüttet das Gehirn besonders viel Dopamin aus?", "a": ["wenn alles genau wie erwartet läuft", "wenn etwas besser ist als erwartet", "wenn die Belohnung ausbleibt"], "r": 1, "why": "Überraschung zählt: besser als erwartet bedeutet extra viel Dopamin."}, {"q": "Welcher Teil des Gehirns wird erst nach dem 20. Geburtstag fertig?", "a": ["das Mittelhirn", "der Hippocampus", "das Stirnhirn"], "r": 2, "why": "Das Stirnhirn plant und bremst. Es entwickelt sich besonders langsam."}, {"q": "Wie viel Schlaf brauchen Jugendliche?", "a": ["5 bis 6 Stunden", "8 bis 10 Stunden", "12 bis 14 Stunden"], "r": 1, "why": "Im Schlaf festigt das Gehirn, was es am Tag gelernt hat."}, {"q": "Warum werden Jugendliche abends später müde?", "a": ["Das Melatonin kommt bis zu 2 Stunden später.", "Sie haben zu viel Dopamin.", "Sie bewegen sich zu wenig."], "r": 0, "why": "Die innere Uhr verschiebt sich in der Pubertät."}, {"q": "Wie wurde das Belohnungssystem 1954 entdeckt?", "a": ["durch einen Zufall im Labor", "durch ein Computerspiel", "durch eine Umfrage"], "r": 0, "why": "Bei einer Ratte saß die Elektrode an der falschen Stelle."}], root = document.getElementById("quiz");
  if (!root) return;
  const COL = ["#FFE27A", "#9CCBFF", "#FF9BD2"];
  let i = 0, score = 0, locked = false;
  function show() {
    const q = Q[i];
    root.innerHTML = '<div class="qtop"><span>Frage ' + (i + 1) + ' von ' + Q.length + '</span><span>' + score + ' richtig</span></div>'
      + '<div class="qbar"><i style="width:' + (i / Q.length * 100) + '%"></i></div><h2 class="qq">' + q.q + '</h2><div class="qa">'
      + q.a.map((a, k) => '<button type="button" data-k="' + k + '" style="--c:' + COL[k] + '"><b>' + "ABC"[k] + '</b><span>' + a + '</span></button>').join("")
      + '</div><div class="qfb" role="status" hidden></div>';
    root.querySelectorAll(".qa button").forEach(b => { b.onclick = () => pick(+b.dataset.k); });
  }
  function pick(k) {
    if (locked) return; locked = true;
    const q = Q[i], ok = k === q.r; if (ok) score++;
    root.querySelectorAll(".qa button").forEach(b => { b.disabled = true; const n = +b.dataset.k; if (n === q.r) b.classList.add("right"); else if (n === k) b.classList.add("wrong"); });
    root.querySelector(".qtop span:last-child").textContent = score + " richtig";
    const fb = root.querySelector(".qfb"); fb.hidden = false;
    fb.innerHTML = '<strong>' + (ok ? "Richtig!" : "Nicht ganz.") + '</strong>' + q.why + '<br><button type="button" class="btn">' + (i < Q.length - 1 ? "Nächste Frage" : "Ergebnis zeigen") + '</button>';
    const nb = fb.querySelector("button"); nb.onclick = () => { i++; locked = false; i < Q.length ? show() : end(); }; nb.focus();
  }
  function end() {
    const msg = score === Q.length ? "Alles richtig. Dein Belohnungssystem feiert gerade!" : score >= Q.length - 2 ? "Stark! Fast alles gewusst." : "Guter Anfang. Schau dir das Video noch einmal an.";
    root.innerHTML = '<div class="qend"><div class="qscore">' + score + ' / ' + Q.length + '</div><h2>' + msg + '</h2><button type="button" class="btn">Nochmal spielen</button></div>';
    root.querySelector("button").onclick = () => { i = 0; score = 0; locked = false; show(); };
    if (score >= Q.length - 1) confetti();
  }
  function confetti() {
    const c = document.createElement("div"); c.className = "confetti"; const cols = ["#FF4FA3", "#FFD23F", "#B6F36A", "#4FA8FF", "#FF5A36", "#CFC3FF"];
    for (let n = 0; n < 70; n++) { const p = document.createElement("i"); p.style.left = Math.random() * 100 + "%"; p.style.background = cols[n % cols.length]; p.style.animationDuration = 1.6 + Math.random() * 1.8 + "s"; p.style.animationDelay = Math.random() * 0.5 + "s"; c.appendChild(p); }
    document.body.appendChild(c); setTimeout(() => c.remove(), 4200);
  }
  show();
})();
</script>
