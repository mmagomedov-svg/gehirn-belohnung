<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Präsentation{% endblock %} – Gehirn und Belohnung</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="site">
  <a class="brand" href="{{ url_for('praesentation') }}">Gehirn und Belohnung<small>Gruppe 1, Informatik 5A</small></a>
  <nav aria-label="Seiten">
    {% for name, text in nav %}
    <a class="navb{% if name == active %} on{% endif %}" href="{{ url_for(name) }}"{% if name == active %} aria-current="page"{% endif %}>{{ text }}</a>
    {% endfor %}
  </nav>
</header>
{% block content %}{% endblock %}

<script src="{{ url_for('static', filename='intro.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
